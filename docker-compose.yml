version: "3.9"

networks:
  nickbar-net:

volumes:
  pgdata:
  redisdata:

services:
  postgres:
    image: postgres:16
    container_name: postgres
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: nickbar
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 3s
      retries: 10
    volumes:
      - pgdata:/var/lib/postgresql/data
      # Optional: init SQLs (e.g., extensions)
      # - ./infra/postgres/init:/docker-entrypoint-initdb.d:ro
    networks: [nickbar-net]

  redis:
    image: redis:7
    container_name: redis
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "6379:6379"
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20
    networks: [nickbar-net]

  kafka:
    image: bitnami/kafka:3.7
    container_name: kafka
    ports:
      - "9092:9092"
    environment:
      # KRaft single-node (no ZooKeeper)
      - KAFKA_ENABLE_KRAFT=yes
      - ALLOW_PLAINTEXT_LISTENER=yes
      - KAFKA_CFG_NODE_ID=1
      - KAFKA_CFG_PROCESS_ROLES=broker,controller
      - KAFKA_CFG_LISTENERS=PLAINTEXT://:9092,CONTROLLER://:9093
      - KAFKA_CFG_ADVERTISED_LISTENERS=PLAINTEXT://kafka:9092
      - KAFKA_CFG_CONTROLLER_LISTENER_NAMES=CONTROLLER
      - KAFKA_CFG_CONTROLLER_QUORUM_VOTERS=1@kafka:9093
      - KAFKA_CFG_INTER_BROKER_LISTENER_NAME=PLAINTEXT
      - KAFKA_CFG_AUTO_CREATE_TOPICS_ENABLE=false
      - KAFKA_CFG_OFFSETS_TOPIC_REPLICATION_FACTOR=1
      - KAFKA_CFG_TRANSACTION_STATE_LOG_REPLICATION_FACTOR=1
      - KAFKA_CFG_TRANSACTION_STATE_LOG_MIN_ISR=1
    healthcheck:
      test: ["CMD-SHELL", "/opt/bitnami/kafka/bin/kafka-topics.sh --bootstrap-server localhost:9092 --list >/dev/null 2>&1"]
      interval: 10s
      timeout: 5s
      retries: 30
    networks: [nickbar-net]
  kafka-topic-init:
    image: bitnami/kafka:3.7
    container_name: kafka-topic-init
    depends_on:
      kafka:
        condition: service_healthy
    restart: "no"
    command:
      - /bin/bash
      - -lc
      - |
        set -euo pipefail
        echo "Waiting for Kafka..."
        until /opt/bitnami/kafka/bin/kafka-topics.sh --bootstrap-server kafka:9092 --list >/dev/null 2>&1; do
          sleep 2
        done
        /opt/bitnami/kafka/bin/kafka-topics.sh \
          --bootstrap-server kafka:9092 \
          --create --if-not-exists \
          --topic OrderPlaced \
          --partitions 3 \
          --replication-factor 1
        /opt/bitnami/kafka/bin/kafka-topics.sh \
          --bootstrap-server kafka:9092 \
          --create --if-not-exists \
          --topic OrderReady \
          --partitions 3 \
          --replication-factor 1
        echo "Kafka topics ready: OrderPlaced, OrderReady"
    networks: [nickbar-net]
  

  # ---------- Services ----------
  # 1) MAIN (Основной)
  main:
    build:
      context: D:/Projects/Go/nickbar_v2           # <= replace
      dockerfile: Dockerfile
      args:
        CMD_DIR: ./                  # <= adjust if your main is elsewhere
    container_name: main
    env_file:
      - D:/Projects/Go/nickbar_v2/config/secrets/common.env
      - D:/Projects/Go/nickbar_v2/config/secrets/${APP_ENV}.env
    environment:
      - APP_ENV=${APP_ENV:-local}
      # Override YAMLs for container networking
      - REDIS_ADDRESS=redis:6379
      - KAFKA_BROKERS=kafka:9092
      - DATABASE_URL=postgres://postgres:postgres@postgres:5432/nickbar?sslmode=disable
      - REDIS_ADDR=redis:6379
      - REDIS_PASSWORD=""
      - REDIS_DB="0"
      # If your app reads APP_ENV to pick base/local.yaml:
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      kafka:
        condition: service_healthy
      kafka-topic-init:
        condition: service_completed_successfully
    ports:
      - "8081:8081"   # host:container
    restart: unless-stopped
    networks: [nickbar-net]

  # 2) OrderService
  order-service:
    build:
      context: D:/Projects/Go/nickbar_v2_ordersvc  # <= replace
      dockerfile: Dockerfile
      args:
        CMD_DIR: ./cmd/nickbar-ordersvc
    container_name: order-service
    env_file:
      - D:/Projects/Go/nickbar_v2_ordersvc/config/secrets/common.env
      - D:/Projects/Go/nickbar_v2_ordersvc/config/secrets/${APP_ENV}.env
    environment:
      - APP_ENV=${APP_ENV:-local}
      - DATABASE_URL=postgres://postgres:postgres@postgres:5432/nickbar?sslmode=disable
      - REDIS_ADDR=redis:6379
      - REDIS_PASSWORD=""
      - REDIS_DB="0"
      - KAFKA_BROKERS=kafka:9092
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      kafka:
        condition: service_healthy
      kafka-topic-init:
        condition: service_completed_successfully
    ports:
      - "8082:8081"
    restart: unless-stopped
    networks: [nickbar-net]

  # 3) KitchenService
  kitchen-service:
    build:
      context: D:/Projects/Go/nickbar_v2_kitchensvc # <= replace
      dockerfile: Dockerfile
      args:
        CMD_DIR: ./cmd/nickbar-kitchensvc
    container_name: kitchen-service
    env_file:
      - D:/Projects/Go/nickbar_v2_kitchensvc/config/secrets/common.env
      - D:/Projects/Go/nickbar_v2_kitchensvc/config/secrets/${APP_ENV}.env
    environment:
      - APP_ENV=${APP_ENV:-local}
      - KAFKA_BROKERS=kafka:9092
      # Add these if KitchenService also touches DB/Redis:
      - DB_HOST=postgres
      - DB_PORT=5432
      - DB_NAME=nickbar
      - REDIS_ADDRESS=redis:6379
    depends_on:
      kafka:
        condition: service_healthy
      kafka-topic-init:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    ports:
      - "8083:8081"
    restart: unless-stopped
    networks: [nickbar-net]
